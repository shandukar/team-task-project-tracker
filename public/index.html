<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Task &amp; Project Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Team Tracker</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" href="#dashboard" data-view="dashboard">Dashboard</a>
          <a class="nav-link" href="#tasks" data-view="tasks">Tasks</a>
          <a class="nav-link" href="#projects" data-view="projects">Projects</a>
          <a class="nav-link" href="#members" data-view="members">Team members</a>
          <span id="team-context" class="navbar-text ms-lg-3"></span>
          <button id="logout-button" class="btn btn-sm btn-outline-light ms-lg-3 my-2 my-lg-0" type="button">Log out</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="notice" class="alert d-none" role="alert"></div>
    <section id="dashboard-view" class="app-view">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div><h1 class="h2 mb-1">Team dashboard</h1><p class="text-secondary mb-0">A quick view of your team's work.</p></div>
        <button class="btn btn-primary" data-create="task">+ New task</button>
      </div>
      <div id="overview-cards" class="row g-3 mb-4"></div>
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Recent tasks</h2><a href="#tasks" data-view="tasks">View all</a>
          </div>
          <div id="recent-tasks"></div>
        </div>
      </div>
    </section>

    <section id="tasks-view" class="app-view d-none">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div><h1 class="h2 mb-1">Tasks</h1><p class="text-secondary mb-0">Track the work across projects.</p></div>
        <button class="btn btn-primary" data-create="task">+ New task</button>
      </div>
      <div class="card shadow-sm mb-3"><div class="card-body">
        <div class="row g-2">
          <div class="col-sm-6 col-lg"><select id="filter-project" class="form-select"><option value="">All projects</option></select></div>
          <div class="col-sm-6 col-lg"><select id="filter-member" class="form-select"><option value="">All assignees</option><option value="unassigned">Unassigned</option></select></div>
          <div class="col-sm-6 col-lg"><select id="filter-status" class="form-select"><option value="">All statuses</option><option>To Do</option><option>In Progress</option><option>Done</option></select></div>
          <div class="col-sm-6 col-lg"><select id="filter-priority" class="form-select"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option></select></div>
        </div>
      </div></div>
      <div class="card shadow-sm"><div class="card-body"><div id="tasks-table"></div></div></div>
    </section>

    <section id="projects-view" class="app-view d-none">
      <div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h2 mb-1">Projects</h1><p class="text-secondary mb-0">Organize work into projects.</p></div><button class="btn btn-primary" data-create="project">+ New project</button></div>
      <div class="card shadow-sm"><div class="card-body"><div id="projects-table"></div></div></div>
    </section>

    <section id="members-view" class="app-view d-none">
      <div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h2 mb-1">Team members</h1><p class="text-secondary mb-0">Manage the people on your team.</p></div><button class="btn btn-primary" data-create="member">+ Add member</button></div>
      <div class="card shadow-sm"><div class="card-body"><div id="members-table"></div></div></div>
    </section>
  </main>

  <div class="modal fade" id="edit-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <form id="edit-form">
        <div class="modal-header"><h2 class="modal-title fs-5" id="modal-title">Add item</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body" id="modal-fields"></div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
      </form>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
