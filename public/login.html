<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Team Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="container py-5">
    <div class="auth-card card shadow-sm mx-auto">
      <div class="card-body p-4 p-md-5">
        <a class="text-decoration-none fw-semibold" href="/">Team Tracker</a>
        <h1 class="h3 mt-4">Welcome back</h1>
        <p class="text-secondary">Log in to continue to your team workspace.</p>
        <div id="auth-error" class="alert alert-danger d-none" role="alert"></div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
        <p class="text-secondary text-center mt-4 mb-0">New to Team Tracker? <a href="/register.html">Create an account</a></p>
      </div>
    </div>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
